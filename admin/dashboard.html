<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard — GoM3U Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<div class="admin-shell">

  <!-- ===============================
       SIDEBAR
       Same markup is repeated on every admin page (no template engine) —
       if you rename a section, update the .active class on all pages.
  =============================== -->
  <aside class="admin-sidebar" id="adminSidebar">
    <a href="../index.html" class="logo">Go<span class="logo-accent">M3U</span></a>
    <nav class="admin-nav">
      <a href="dashboard.html" class="active">Dashboard</a>
      <a href="posts.html">Posts</a>
      <a href="post-editor.html">Add Post</a>
      <a href="settings.html">Settings</a>
      <button class="logout-link" id="logoutBtn">Logout</button>
    </nav>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="icon-btn admin-sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h1>Dashboard</h1>
      </div>
    </header>

    <div class="admin-content">

      <div class="stat-grid" id="statGrid">
        <div class="stat-card"><div class="stat-label">Total Posts</div><div class="stat-value" id="statTotalPosts">–</div></div>
        <div class="stat-card"><div class="stat-label">Active Posts</div><div class="stat-value" id="statActivePosts">–</div></div>
        <div class="stat-card"><div class="stat-label">Disabled Posts</div><div class="stat-value" id="statDisabledPosts">–</div></div>
        <div class="stat-card"><div class="stat-label">Total Views</div><div class="stat-value" id="statTotalViews">–</div></div>
        <div class="stat-card"><div class="stat-label">Total Unlocks</div><div class="stat-value" id="statTotalUnlocks">–</div></div>
        <div class="stat-card"><div class="stat-label">Today's Unlocks</div><div class="stat-value" id="statTodayUnlocks">–</div></div>
      </div>

      <div class="admin-panel">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:var(--space-3);">
          <h2 style="margin:0;">Views &amp; Unlocks</h2>
          <div class="row-actions" id="statsPeriodButtons">
            <button class="btn btn-outline btn-sm active-period" data-period="today">Today</button>
            <button class="btn btn-outline btn-sm" data-period="7">7 Days</button>
            <button class="btn btn-outline btn-sm" data-period="30">30 Days</button>
            <button class="btn btn-outline btn-sm" data-period="all">All Time</button>
          </div>
        </div>
        <canvas id="statsChart" width="600" height="200" style="max-width:100%;"></canvas>
        <p class="form-hint" id="statsChartHint"></p>
      </div>

      <div class="admin-panel">
        <h2>Recent Posts</h2>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead><tr><th>Title</th><th>Category</th><th>Status</th><th>Created</th></tr></thead>
            <tbody id="recentPostsBody">
              <tr><td colspan="4" class="form-hint">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="admin-panel">
        <h2>Recent Unlock Activity</h2>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead><tr><th>Post</th><th>When</th></tr></thead>
            <tbody id="recentUnlocksBody">
              <tr><td colspan="2" class="form-hint">No unlock activity yet.</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="../js/utils.js"></script>
<script type="module" src="js/dashboard.js"></script>
</body>
</html>
