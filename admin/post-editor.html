<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Post Editor — GoM3U Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar">
    <a href="../index.html" class="logo">Go<span class="logo-accent">M3U</span></a>
    <nav class="admin-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="posts.html">Posts</a>
      <a href="post-editor.html" class="active">Add Post</a>
      <a href="settings.html">Settings</a>
      <button class="logout-link" id="logoutBtn">Logout</button>
    </nav>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="icon-btn admin-sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h1 id="editorHeading">Add Post</h1>
      </div>
    </header>

    <div class="admin-content">
      <form id="postForm" class="editor-grid" novalidate>

        <!-- Main fields -->
        <div class="admin-panel">
          <div class="form-field">
            <label for="title">Title *</label>
            <input type="text" id="title" required maxlength="120">
          </div>

          <div class="form-field">
            <label for="description">Description</label>
            <textarea id="description" maxlength="400"></textarea>
          </div>

          <div class="form-field">
            <label for="category">Category *</label>
            <input type="text" id="category" required maxlength="60" placeholder="e.g. General">
          </div>

          <div class="form-field">
            <label for="realLink">Destination Link *</label>
            <input type="url" id="realLink" required placeholder="https://…">
            <p class="form-hint">Shown to the user only after they complete verification.</p>
          </div>

          <div class="form-field">
            <label for="adUrl1">Ad URL — Step 1 *</label>
            <input type="url" id="adUrl1" required placeholder="https://…">
          </div>

          <div class="form-field">
            <label for="adUrl2">Ad URL — Step 2 *</label>
            <input type="url" id="adUrl2" required placeholder="https://…">
          </div>

          <div class="form-field">
            <label for="verifyTime">Verification Time (seconds per step)</label>
            <input type="number" id="verifyTime" min="5" max="120" value="20">
          </div>

          <div class="form-field">
            <label for="notice">Post Notice (optional)</label>
            <input type="text" id="notice" maxlength="140" placeholder="Shown on the locker page for this post">
          </div>

          <div class="form-field">
            <label for="status">Status</label>
            <select id="status">
              <option value="draft">Draft</option>
              <option value="active" selected>Active</option>
              <option value="disabled">Disabled</option>
            </select>
          </div>

          <div class="form-field">
            <label for="sortOrder">Sort Order</label>
            <input type="number" id="sortOrder" value="0">
            <p class="form-hint">Lower numbers appear first on the homepage.</p>
          </div>
        </div>

        <!-- Thumbnail -->
        <div class="admin-panel">
          <div class="form-field">
            <label>Thumbnail</label>
            <label class="thumb-upload" id="thumbUploadLabel">
              <img id="thumbPreview" src="../assets/default-thumbnail.png" alt="Thumbnail preview">
              <p class="form-hint">Click to upload — JPG, PNG or WEBP, up to 2MB</p>
              <input type="file" id="thumbInput" accept="image/jpeg,image/png,image/webp">
            </label>
            <p class="form-error" id="thumbError" hidden></p>
          </div>
        </div>

        <div style="grid-column: 1 / -1; display:flex; gap:10px;">
          <button type="submit" class="btn btn-primary btn-lg" id="saveBtn">Save Post</button>
          <a href="posts.html" class="btn btn-outline btn-lg">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="../js/utils.js"></script>
<script type="module" src="js/post-editor.js"></script>
</body>
</html>
